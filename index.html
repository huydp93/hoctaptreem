<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#7ec8e3" />
    <link rel="icon" href="data:," />
    <title>Làng Chữ Cái</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1e2a3a;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: 'Baloo 2', 'Comic Sans MS', 'Segoe UI', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e2a3a;
      }
      #app canvas {
        touch-action: none;
      }

      /* Rotate device overlay */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: linear-gradient(160deg, #6dc0ea, #4aa8d8);
        color: #fff;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #rotate-overlay .icon {
        font-size: 72px;
        animation: rotatePhone 1.6s ease-in-out infinite;
        margin-bottom: 16px;
      }
      #rotate-overlay .title {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      #rotate-overlay .subtitle {
        font-size: 18px;
        opacity: 0.9;
      }
      @keyframes rotatePhone {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-90deg); }
      }

      /* Loading screen (native, before Phaser boots) */
      #native-loading {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: linear-gradient(160deg, #ffd977, #ff9f7a);
        color: #4a2c00;
      }
      #native-loading .emoji {
        font-size: 64px;
        margin-bottom: 12px;
        animation: bounce 1s ease-in-out infinite;
      }
      #native-loading .text {
        font-size: 22px;
        font-weight: 700;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="native-loading">
      <div class="emoji">🎈</div>
      <div class="text">Đang tải Làng Chữ Cái...</div>
    </div>

    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div class="title">Xoay ngang màn hình nhé!</div>
      <div class="subtitle">Trò chơi chơi tốt nhất khi màn hình nằm ngang</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
